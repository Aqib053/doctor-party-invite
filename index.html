<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re invited: Doctor Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dff3ee;
    --bg-glow: #f3fbf8;
    --ink: #0c3a39;
    --muted: #2f5f5c;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f2328; --bg-glow: #1a3a40; --ink: #eaf7f4; --muted: #a9d3cd;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f2328; --bg-glow: #1a3a40; --ink: #eaf7f4; --muted: #a9d3cd;
    color-scheme: dark;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-glow), var(--bg) 72%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  .track { position: relative; height: 820vh; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hero { position: absolute; left: 0; right: 0; top: 7%; padding: 0 6vw; text-align: center; }
  .hero h1 {
    margin: 0 auto; max-width: 14em;
    font-family: var(--display); font-weight: 800;
    font-size: clamp(28px, 7.4vw, 50px); line-height: 1.05; letter-spacing: -.01em;
  }
  .hero p { margin: .6em 0 0; color: var(--muted); font-size: clamp(15px, 4vw, 18px); }

  .hint {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4svh);
    text-align: center; color: var(--muted); font-weight: 500; font-size: 15px;
  }
  .hint svg { display: block; margin: 6px auto 0; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(6px); } }

  /* invitation text, revealed line by line */
  .invite {
    position: absolute; left: 50%; top: 50%;
    width: min(88vw, 520px);
    transform: translate(-50%, -50%);
    text-align: center; color: var(--ink);
    text-shadow: 0 0 16px var(--bg), 0 0 6px var(--bg);
    pointer-events: none;
  }
  .ln { margin: 0; opacity: 0; will-change: opacity, transform; }
  .ln.small   { font-size: clamp(16px, 4.4vw, 21px); font-weight: 500; color: var(--muted); }
  .ln.title   { margin: .1em 0 .25em; font-family: var(--display); font-weight: 800;
                font-size: clamp(32px, 10vw, 56px); line-height: 1.04; }
  .ln.body    { margin: 0 auto .9em; max-width: 19em; font-size: clamp(16px, 4.4vw, 20px); line-height: 1.35; }
  .pill {
    display: inline-block; background: var(--ink); color: var(--bg); text-shadow: none;
    font-weight: 700; font-size: clamp(18px, 5vw, 24px);
    padding: .4em 1em; border-radius: 999px;
  }
  .ln.where   { margin-top: .7em; font-family: var(--display); font-weight: 600;
                font-size: clamp(24px, 7vw, 36px); line-height: 1.15; }
  .ln.welcome { margin-top: .35em; font-size: clamp(16px, 4.4vw, 20px); color: var(--muted); }

  .nogl .invite { position: static; transform: none; margin: 30vh auto 0; text-shadow: none; }
  .nogl .ln { opacity: 1; }
  .nogl .track { height: auto; }
  .nogl .stage { position: static; height: auto; padding: 8vh 0; }
  .nogl .hero { position: static; }
  .nogl .hint, .nogl #gl { display: none; }

  @media (prefers-reduced-motion: reduce) { .hint svg { animation: none; } }
</style>
</head>
<body>

<main class="track" id="track">
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>

    <header class="hero" id="hero">
      <h1>Something to smile about</h1>
      <p>Big news from our family</p>
    </header>

    <!-- Edit the text below with your sister’s name and details -->
    <div class="invite" id="invite">
      <p class="ln small">You’re invited</p>
      <h2 class="ln title">Dr. Afrah Fathima Moez</h2>
      <p class="ln body">Our new doctor has completed her BDS. Come celebrate with the whole family.</p>
      <p class="ln when"><span class="pill">Thursday at 8:00 PM</span></p>
      <p class="ln where">Azam’s Residence</p>
      <p class="ln welcome">You all are welcome. See you there! 🦷</p>
    </div>

    <div class="hint" id="hint">
      Scroll down to open
      <svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l8 8 8-8"/></svg>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var doc = document.documentElement;
  function fallback() { doc.classList.add('nogl'); }
  if (!window.THREE) { fallback(); return; }
  var T = THREE;

  var canvas = document.getElementById('gl'), renderer;
  try { renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); }
  catch (e) { fallback(); return; }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(30, 1, 1, 300);

  function sp(v, e) { return (v < 0 ? -1 : 1) * Math.pow(Math.abs(v), e); }
  function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function lin(hex) { return new T.Color(hex).convertSRGBToLinear(); }
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  /* ---------- studio light and reflections ---------- */
  var pm = new T.PMREMGenerator(renderer);
  var envScene = new T.Scene();
  envScene.add(new T.Mesh(new T.BoxGeometry(50, 50, 50), new T.MeshBasicMaterial({ color: 0x7c8d93, side: T.BackSide })));
  function softbox(w, h, x, y, z, c) {
    var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m);
  }
  softbox(26, 10, 0, 20, 10, 0xffffff);
  softbox(10, 20, -20, 4, 8, 0xffffff);
  softbox(10, 20, 20, 2, 8, 0xe4edf2);
  softbox(30, 5, 0, -16, 12, 0xffe3e0);
  scene.environment = pm.fromScene(envScene, 0.03).texture;

  scene.add(new T.HemisphereLight(0xffffff, 0xffb4ac, 0.32));
  var key = new T.DirectionalLight(0xfff6ee, 1.2);
  key.position.set(-4, 12, 12);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -11; key.shadow.camera.right = 11;
  key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
  key.shadow.camera.near = 1; key.shadow.camera.far = 60;
  key.shadow.bias = -0.0005; key.shadow.normalBias = 0.03; key.shadow.radius = 3;
  scene.add(key);

  /* ---------- one tooth ---------- */
  var C_ROOT = lin(0xe9d7ad), C_ENAM = lin(0xfbf8f1), C_EDGE = lin(0xe8f1f8), C_SIDE = lin(0xd6d1c6);
  var E1 = 0.55, E2 = 0.5;

  function toothGeom(o) {
    var g = new T.SphereGeometry(1, 44, 40);
    var pos = g.attributes.position, n = pos.count, col = new Float32Array(n * 3), c = new T.Color();
    for (var i = 0; i < n; i++) {
      var py = pos.getY(i), pz = pos.getZ(i), px = pos.getX(i);
      var u = Math.asin(Math.max(-1, Math.min(1, py))), v = Math.atan2(pz, px);
      var cu = Math.cos(u), su = Math.sin(u), cv = Math.cos(v), sv = Math.sin(v);
      var X = sp(cu, E1) * sp(cv, E2), Y = sp(su, E1), Z = sp(cu, E1) * sp(sv, E2);
      var yN = (Y + 1) / 2;
      var x = X * o.w / 2 * (1 - o.taper * yN);
      var y = yN * o.h;
      var z = Z * o.d / 2 * (0.34 + 0.66 * sstep(0, 0.55, yN)) - yN * o.d * 0.2;
      if (o.kind === 'c') {
        y -= o.h * 0.2 * Math.pow(1 - Math.abs(X), 1.5) * (1 - sstep(0, 0.5, yN));
      } else if (o.kind === 'p') {
        y -= o.h * 0.09 * (0.5 + 0.5 * Math.cos(X * Math.PI * 1.7)) * Math.pow(1 - yN, 3);
      } else if (o.kind === 'm') {
        var cusp = Math.abs(Math.sin(X * Math.PI)) * Math.abs(Math.sin(Z * Math.PI));
        y -= o.h * 0.07 * cusp * Math.pow(1 - yN, 3);
      } else {
        y -= o.h * 0.04 * (1 - Math.abs(X)) * Math.pow(1 - yN, 3);
        z += 0.03 * Math.cos(X * Math.PI * 2.2) * sstep(0.1, 0.5, yN) * (1 - sstep(0.6, 1, yN)) * (Z > 0 ? 1 : 0);
      }
      pos.setXYZ(i, x, y, z);
      c.copy(C_ENAM);
      if (yN > 0.5) c.lerp(C_ROOT, sstep(0.5, 1, yN) * 0.8);
      if (yN < 0.22) c.lerp(C_EDGE, (1 - yN / 0.22) * 0.8);
      c.lerp(C_SIDE, sstep(0.6, 1, Math.abs(X)) * 0.45);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new T.BufferAttribute(col, 3));
    g.computeVertexNormals();
    return g;
  }

  var toothMat = new T.MeshPhysicalMaterial({
    vertexColors: true, roughness: 0.22, metalness: 0,
    clearcoat: 0.9, clearcoatRoughness: 0.12, envMapIntensity: 1.0
  });
  var gumMat = new T.MeshPhysicalMaterial({
    color: lin(0xe5605a), roughness: 0.3, clearcoat: 0.85, clearcoatRoughness: 0.14,
    envMapIntensity: 0.9, side: T.DoubleSide
  });
  var tongueMat = new T.MeshPhysicalMaterial({
    color: lin(0xc72f3e), roughness: 0.34, clearcoat: 0.7, clearcoatRoughness: 0.2, envMapIntensity: 0.7
  });

  /* ---------- U-shaped dental arch ---------- */
  var A = 3.7, B = 4.2, TABLE = 1400, TMAX = 2.3, TH = [], CL = [];
  (function () {
    var len = 0, px = 0, pz = 0;
    for (var i = 0; i <= TABLE; i++) {
      var t = i / TABLE * TMAX, x = A * Math.sin(t), z = B * (Math.cos(t) - 1);
      if (i > 0) len += Math.hypot(x - px, z - pz);
      TH.push(t); CL.push(len); px = x; pz = z;
    }
  })();
  function thetaAt(s) {
    var lo = 0, hi = TABLE;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (CL[mid] < s) lo = mid; else hi = mid; }
    var f = (s - CL[lo]) / Math.max(1e-6, CL[hi] - CL[lo]);
    return TH[lo] + (TH[hi] - TH[lo]) * f;
  }
  function frame(sSigned) {
    var sg = sSigned < 0 ? -1 : 1, t = thetaAt(Math.abs(sSigned));
    var nx = Math.sin(t) / A, nz = Math.cos(t) / B, nl = Math.hypot(nx, nz);
    nx /= nl; nz /= nl;
    return { x: sg * A * Math.sin(t), z: B * (Math.cos(t) - 1), nx: sg * nx, nz: nz, rotY: Math.atan2(sg * nx, nz) };
  }

  var SPEC = [
    { k: 'i', w: 1.00, h: 1.28, d: 0.62, y0: 0.00, taper: 0.22 },
    { k: 'i', w: 0.76, h: 1.08, d: 0.52, y0: 0.10, taper: 0.25 },
    { k: 'c', w: 0.88, h: 1.22, d: 0.70, y0: 0.05, taper: 0.30 },
    { k: 'p', w: 0.82, h: 1.00, d: 0.90, y0: 0.22, taper: 0.20 },
    { k: 'p', w: 0.78, h: 0.96, d: 0.95, y0: 0.34, taper: 0.20 },
    { k: 'm', w: 1.08, h: 0.90, d: 1.05, y0: 0.40, taper: 0.15 },
    { k: 'm', w: 1.02, h: 0.86, d: 1.02, y0: 0.44, taper: 0.15 }
  ];
  var GAP = 0.012;

  function buildJaw(cfg) {
    var grp = new T.Group(), E = [], side, i, sCur;
    for (side = -1; side <= 1; side += 2) {
      sCur = 0;
      for (i = 0; i < SPEC.length; i++) {
        var sp0 = SPEC[i], w = sp0.w * cfg.ws, h = sp0.h * cfg.hs;
        var sc = sCur + w / 2; sCur += w + GAP;
        var fr = frame(side * sc);
        var y0 = sp0.y0 * cfg.hs + (rnd() - 0.5) * 0.03;
        var m = new T.Mesh(toothGeom({ kind: sp0.k, w: w, h: h, d: sp0.d * cfg.ds, taper: sp0.taper }), toothMat);
        m.position.set(fr.x, y0, fr.z);
        m.rotation.y = fr.rotY + (rnd() - 0.5) * 0.035;
        m.rotation.z = (rnd() - 0.5) * 0.03;
        m.castShadow = true; m.receiveShadow = true;
        grp.add(m);
        E.push({ s: side * sc, w: w, g: y0 + h * 0.96 });
      }
    }
    E.sort(function (a, b) { return a.s - b.s; });
    for (i = 0; i < E.length; i++) {
      var Lf = E[i - 1], Rt = E[i + 1];
      E[i].pl = (Lf ? Math.min(Lf.g, E[i].g) : E[i].g) - 0.4 * cfg.hs;
      E[i].pr = (Rt ? Math.min(Rt.g, E[i].g) : E[i].g) - 0.4 * cfg.hs;
    }
    function marginAt(s) {
      for (var k = 0; k < E.length; k++) {
        var a = E[k].s - E[k].w / 2 - 0.006, b = E[k].s + E[k].w / 2 + 0.006;
        if (s >= a && s <= b) {
          var t = (s - a) / (b - a), base = E[k].pl + (E[k].pr - E[k].pl) * t;
          return base + (E[k].g - base) * Math.pow(Math.sin(Math.PI * t), 0.75);
        }
      }
      return s < 0 ? E[0].pl : E[E.length - 1].pr;
    }

    // gum base: a rounded band swept along the arch
    var SEND = E[E.length - 1].s + E[E.length - 1].w / 2 + 0.05, CAP = 0.5, NS = 380, NV = 30;
    var P = [], idx = [], ix, iv;
    for (ix = 0; ix <= NS; ix++) {
      var s = -SEND - CAP + (2 * (SEND + CAP)) * ix / NS;
      var as = Math.abs(s), over = as - SEND, k = 1;
      if (over > 0) k = Math.sqrt(Math.max(0, 1 - (over / CAP) * (over / CAP)));
      var fr2 = frame(s), mg = marginAt(Math.max(-SEND, Math.min(SEND, s)));
      var bot = mg - 0.18, c = (bot + cfg.top) / 2, ryy = (cfg.top - bot) / 2;
      for (iv = 0; iv <= NV; iv++) {
        var ph = iv / NV * Math.PI * 2;
        var r = cfg.rr * k * sp(Math.cos(ph), 0.72) + cfg.roff;
        var y = c + ryy * (0.35 + 0.65 * k) * sp(Math.sin(ph), 0.8);
        P.push(fr2.x + fr2.nx * r, y, fr2.z + fr2.nz * r);
      }
    }
    for (ix = 0; ix < NS; ix++) for (iv = 0; iv < NV; iv++) {
      var a2 = ix * (NV + 1) + iv, b2 = a2 + 1, c2 = a2 + (NV + 1), d2 = c2 + 1;
      idx.push(a2, c2, b2, b2, c2, d2);
    }
    var gg = new T.BufferGeometry();
    gg.setAttribute('position', new T.Float32BufferAttribute(P, 3));
    gg.setIndex(idx); gg.computeVertexNormals();
    var gum = new T.Mesh(gg, gumMat); gum.castShadow = true; gum.receiveShadow = true;
    grp.add(gum);
    return grp;
  }

  var HZ = 5.3, CZ = 2.6;
  var upper = buildJaw({ ws: 1, hs: 1, ds: 1, top: 2.7, rr: 0.72, roff: -0.02 });
  var lower = buildJaw({ ws: 0.92, hs: 0.88, ds: 0.92, top: 2.4, rr: 0.66, roff: -0.02 });
  lower.scale.set(0.94, -1, 0.94);
  upper.position.z = HZ; lower.position.z = HZ - 0.12;

  var uPivot = new T.Group(), lPivot = new T.Group(), rig = new T.Group();
  uPivot.position.set(0, 0, -HZ + CZ); lPivot.position.set(0, 0, -HZ + CZ);
  uPivot.add(upper); lPivot.add(lower);

  // tongue lies inside the lower arch
  var tg = new T.SphereGeometry(1, 56, 40), tp = tg.attributes.position;
  for (var q = 0; q < tp.count; q++) {
    var qx = tp.getX(q), qy = tp.getY(q), qz = tp.getZ(q);
    var f = 1 + 0.025 * Math.sin(qx * 14) * Math.sin(qz * 12);
    var squash = qy < 0 ? 0.55 : 1;
    tp.setXYZ(q, qx * f, qy * squash, qz * f);
  }
  tg.computeVertexNormals();
  var tongue = new T.Mesh(tg, tongueMat);
  tongue.scale.set(2.5, 1.3, 2.6);
  tongue.position.set(0, -1.1, HZ - 3.2);
  tongue.receiveShadow = true; tongue.castShadow = true;
  lPivot.add(tongue);

  rig.add(uPivot); rig.add(lPivot);
  scene.add(rig);



  /* ---------- camera ---------- */
  var camDist = 30, vw = 1, vh = 1, aimY = 0;
  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    renderer.setSize(vw, vh, false);
    camera.aspect = vw / vh;
    var pxPerUnit = Math.min(vw * 0.9, 560) / 10.2;
    var visH = vh / pxPerUnit;
    camDist = (visH / 2) / Math.tan(T.MathUtils.degToRad(camera.fov / 2));
    camera.far = camDist + 80;
    camera.updateProjectionMatrix();
  }

  /* ---------- scroll ---------- */
  var track = document.getElementById('track');
  var invite = document.getElementById('invite');
  var hero = document.getElementById('hero');
  var hint = document.getElementById('hint');
  var lines = invite.querySelectorAll('.ln');
  var ticking = false;
  var lineTop = [], lineH = [], boxH = 0;
  function measure() {
    boxH = invite.offsetHeight;
    for (var i = 0; i < lines.length; i++) { lineTop[i] = lines[i].offsetTop; lineH[i] = lines[i].offsetHeight; }
  }

  function clamp(x) { return Math.min(1, Math.max(0, x)); }
  function smooth(a, b, x) { var t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); }

  function update() {
    ticking = false;
    var rect = track.getBoundingClientRect();
    var total = rect.height - window.innerHeight;
    var raw = total > 0 ? clamp(-rect.top / total) : 0;
    var p = smooth(0, 0.55, raw);

    uPivot.rotation.x = -1.05 * p; uPivot.position.y = 5.4 * p;
    lPivot.rotation.x = 0.3 * p;   lPivot.position.y = -5.8 * p;
    rig.rotation.y = -0.35 * p;

    var el = 0.2 - 0.05 * p;
    aimY = 0.1;
    camera.position.set(0, aimY + camDist * Math.sin(el), camDist * Math.cos(el));
    camera.lookAt(0, aimY, 0);

    // text starts while the mouth is still opening, one line at a time, slowly.
    // the block stays centred on the lines that are visible so far.
    var n = lines.length, vis = 0;
    for (var i = 0; i < n; i++) {
      var s = 0.14 + i * 0.125, o = smooth(s, s + 0.12, raw);
      lines[i].style.opacity = o;
      lines[i].style.transform = 'translateY(' + ((1 - o) * 18).toFixed(1) + 'px)';
      if (o > 0.001) vis = Math.max(vis, lineTop[i] + o * lineH[i]);
    }
    var shift = (boxH - vis) / 2;
    invite.style.transform = 'translate(-50%, calc(-50% + ' + shift.toFixed(1) + 'px))';

    var h = 1 - smooth(0, 0.08, raw);
    hero.style.opacity = h;
    hero.style.transform = 'translateY(' + ((1 - h) * -20).toFixed(1) + 'px)';
    hint.style.opacity = h;

    renderer.render(scene, camera);
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () { resize(); measure(); onScroll(); });
  resize();
  measure();
  update();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); onScroll(); });
  window.addEventListener('load', function () { measure(); onScroll(); });
  window.__ready = true;
})();
</script>
</body>
</html>
